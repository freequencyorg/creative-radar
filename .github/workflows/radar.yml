name: Creative Radar

on:
  schedule:
    - cron: "0 6 * * *"   # 03:00 em Brasília
  workflow_dispatch:
    inputs:
      anos:
        description: "Anos de projeto (dois dígitos, separados por espaço). Vazio = últimos 4."
        required: false
        default: ""

# Os dados não entram mais no git: a coleta vira um artefato do Pages e é publicada direto.
# Assim o repositório não cresce a cada madrugada e não há limite de 100 MB por arquivo.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: creative-radar
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Coletar projetos do SALIC
        run: |
          if [ -n "${{ github.event.inputs.anos }}" ]; then
            python3 coletar_salic.py --anos ${{ github.event.inputs.anos }}
          else
            python3 coletar_salic.py
          fi
      - name: Copiar dicionário de sinônimos para a página
        run: cp config/sinonimos.json docs/data/sinonimos.json
      - name: Resumo da coleta
        run: python3 -c "import json;m=json.load(open('docs/data/meta.json'));print({k:m.get(k) for k in ('coletado_em','lidos','retidos','captando','indefinidos','erros')})"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
