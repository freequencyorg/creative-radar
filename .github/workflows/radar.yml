name: Creative Radar

on:
  schedule:
    - cron: "0 6 * * *"   # 03:00 em Brasília
  workflow_dispatch:
    inputs:
      anos:
        description: "Anos de projeto (dois dígitos, separados por espaço). Vazio = últimos 4."
        required: false
        default: ""
      somente:
        description: "O que coletar agora. 'auto' = projetos todo dia, incentivadores aos domingos."
        required: false
        default: "auto"
        type: choice
        options: ["auto", "tudo", "projetos", "incentivadores"]

# Os dados não entram no git: a coleta vira um artefato do Pages e é publicada direto.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: creative-radar
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Incentivadores mudam devagar: em seis dias entraram 15 registros em 60 mil.
      # Rodar todo dia só gastava uma hora e empurrava a rodada para o teto de tempo.
      - name: Decidir o que coletar hoje
        id: plano
        run: |
          pedido="${{ github.event.inputs.somente }}"
          [ -z "$pedido" ] && pedido="auto"
          projetos=sim
          incentivadores=nao
          case "$pedido" in
            projetos)       incentivadores=nao ;;
            incentivadores) projetos=nao; incentivadores=sim ;;
            tudo)           incentivadores=sim ;;
            auto)           [ "$(date -u +%u)" = "7" ] && incentivadores=sim ;;
          esac
          echo "projetos=$projetos" >> "$GITHUB_OUTPUT"
          echo "incentivadores=$incentivadores" >> "$GITHUB_OUTPUT"
          echo "Hoje: projetos=$projetos · incentivadores=$incentivadores (pedido: $pedido)"

      # continue-on-error deixa a rodada seguir quando uma coleta recusa publicar
      # ou quebra. O resultado verdadeiro fica em steps.<id>.outcome; o conclusion
      # vira "success" de qualquer jeito, então é o outcome que vale daqui para a frente.
      - name: Coletar projetos do SALIC
        id: proj
        if: steps.plano.outputs.projetos == 'sim'
        continue-on-error: true
        run: |
          if [ -n "${{ github.event.inputs.anos }}" ]; then
            python3 coletar_salic.py --anos ${{ github.event.inputs.anos }}
          else
            python3 coletar_salic.py
          fi

      - name: Coletar incentivadores do SALIC
        id: inc
        if: steps.plano.outputs.incentivadores == 'sim'
        continue-on-error: true
        run: python3 coletar_incentivadores.py

      # Publicar só faz sentido quando alguma coleta trouxe dado novo. Sem isso, a
      # rodada para aqui e a página continua exatamente como está — que é melhor do
      # que rebaixá-la para uma cópia antiga.
      - name: Vale publicar?
        id: vale
        run: |
          fresco=nao
          [ "${{ steps.proj.outcome }}" = "success" ] && [ -s docs/data/meta.json ] && fresco=sim
          [ "${{ steps.inc.outcome }}" = "success" ] && [ -s docs/data/incentivadores-meta.json ] && fresco=sim
          echo "fresco=$fresco" >> "$GITHUB_OUTPUT"
          if [ "$fresco" = "nao" ]; then
            echo "Nenhuma coleta trouxe dado novo. A página fica como está." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      # Completa o que não foi coletado agora com o que já está publicado. O
      # parâmetro de tempo evita pegar cópia velha guardada no CDN, que foi o que
      # jogou a base de volta para setembro em 23/10.
      - name: Completar com o que já está publicado
        if: steps.vale.outputs.fresco == 'sim'
        run: |
          mkdir -p docs/data
          agora=$(date -u +%s)
          baixar() {
            [ -s "docs/data/$1" ] && return 0
            curl -fsSL --retry 3 -H 'Cache-Control: no-cache' "https://radar.freequency.org/data/$1?t=$agora" -o "docs/data/$1" \
              || echo "ainda sem $1"
          }
          for f in meta.json salic-captacao.json incentivadores-meta.json salic-incentivadores.json; do baixar "$f"; done

      - name: Copiar dicionário de sinônimos para a página
        if: steps.vale.outputs.fresco == 'sim'
        run: cp config/sinonimos.json docs/data/sinonimos.json

      - name: Resumo da coleta
        if: steps.vale.outputs.fresco == 'sim'
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, os
          for titulo, arq in (("Projetos", "meta.json"), ("Incentivadores", "incentivadores-meta.json")):
              caminho = os.path.join("docs/data", arq)
              if not os.path.exists(caminho):
                  print(f"- **{titulo}**: sem arquivo")
                  continue
              m = json.load(open(caminho))
              print(f"- **{titulo}**: coleta de {m.get('coletado_em')} · {m.get('lidos')} lidos · {m.get('retidos')} guardados · {len(m.get('erros') or [])} erros")
          PY

      - uses: actions/configure-pages@v5
        if: steps.vale.outputs.fresco == 'sim'
      - uses: actions/upload-pages-artifact@v3
        if: steps.vale.outputs.fresco == 'sim'
        with:
          path: docs
      - id: deploy
        if: steps.vale.outputs.fresco == 'sim'
        uses: actions/deploy-pages@v4

      # Vermelho só quando uma coleta que era para rodar não rodou. Incentivadores
      # reaproveitados num dia de semana são o plano, não um problema.
      - name: Avisar se alguma coleta planejada falhou
        if: (steps.plano.outputs.projetos == 'sim' && steps.proj.outcome != 'success') || (steps.plano.outputs.incentivadores == 'sim' && steps.inc.outcome != 'success')
        run: |
          echo "### Coleta incompleta" >> "$GITHUB_STEP_SUMMARY"
          echo "- projetos: planejado=${{ steps.plano.outputs.projetos }} resultado=${{ steps.proj.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- incentivadores: planejado=${{ steps.plano.outputs.incentivadores }} resultado=${{ steps.inc.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Causas comuns: a API do SALIC caiu no meio, ou a trava barrou uma coleta parcial." >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
          exit 1
